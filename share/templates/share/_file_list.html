{% for e in entries %}
  {% if e.kind == "dir" %}
    <div class="folder">
      <div class="row dir">
        <button class="folder-toggle{% if not e.has_children %} empty{% endif %}"
                type="button"
                aria-expanded="false"
                {% if e.has_children %}
                hx-get="{% url 'share:list-files' %}?path={{ e.relpath|urlencode }}"
                hx-target="next .children"
                hx-swap="innerHTML"
                hx-trigger="click once"
                {% endif %}>›</button>
        <span class="icon">📁</span><span class="name">{{ e.name }}/</span>
      </div>
      {% if e.has_children %}
        <div class="children"></div>
      {% endif %}
    </div>
  {% else %}
    <div class="row file">
      <span class="icon">📄</span>
      <a class="name" href="{% url 'share:download' e.relpath %}">{{ e.name }}</a>
      <span class="size">{{ e.size }}</span>
    </div>
  {% endif %}
{% endfor %}
