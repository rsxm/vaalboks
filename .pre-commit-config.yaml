repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: biome
        name: Biome
        entry: bun run check
        language: system
        pass_filenames: false
