name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: Django tests
        run: uv run python manage.py test
      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome check share/static/share/app.js

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv python install 3.14
      - run: uv build
